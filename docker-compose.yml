services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesgenie
      POSTGRES_USER: salesgenie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - salesgenie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesgenie -d salesgenie"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://salesgenie:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/salesgenie
      SALES_GENIE_DEMO_MODE: "false"
      SALES_GENIE_LLM_PROVIDER: ${SALES_GENIE_LLM_PROVIDER:-mock}
      SALES_GENIE_LLM_MODEL: ${SALES_GENIE_LLM_MODEL:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  ui:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      SALES_GENIE_DEMO_MODE: "false"
      SALES_GENIE_BACKEND_BASE_URL: http://api:8000
      SALES_GENIE_BACKEND_API_PREFIX: /api/v1
      SALES_GENIE_LLM_PROVIDER: ${SALES_GENIE_LLM_PROVIDER:-mock}
      SALES_GENIE_LLM_MODEL: ${SALES_GENIE_LLM_MODEL:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
volumes:
  salesgenie_pgdata:
