[pytest]
# The canonical suite lives in ``tests/``.  The ``contributions/`` folders are
# standalone deliverables with their own suites and their own import roots, so
# they must not be collected from the repository root: two of them reuse module
# names (``test_scoring.py``) and one imports its local ``database`` package.
# Run a contribution's suite from inside its own folder, for example:
#   cd contributions/mahidhar-ai-layer && python -m pytest -q
norecursedirs = .git .venv venv __pycache__ .pytest_cache contributions node_modules
